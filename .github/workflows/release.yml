name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # a dry run: builds the installer, publishes nothing

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        run: npm run dist
      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/Lyra-Setup-*.exe release/Lyra-Setup-*.exe.blockmap release/latest.yml \
            --title "Lyra ${{ github.ref_name }}" \
            --generate-notes
